<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="自宅回線の DNS 応答レイテンシをサーバー別に可視化するモニター">
  <title>DNS Latency Monitor</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1645913691678081" crossorigin="anonymous"></script>
</head>
<body>
  <a class="skip-link" href="#main">メインコンテンツへ</a>

  <div class="shell">
    <header class="masthead">
      <div class="masthead-text">
        <h1>DNS Latency Monitor</h1>
        <p class="masthead-sub" id="subtitle">自宅回線の DNS 応答レイテンシ — DNS サーバー別</p>
      </div>
      <div
        class="range"
        id="rangeSelector"
        role="group"
        aria-label="表示範囲（グラフの横幅）"
      ></div>
    </header>

    <main class="page" id="main">
      <p class="status" id="lastUpdated" role="status" aria-live="polite">読み込み中...</p>

      <!-- Primary: latency timeline -->
      <section class="primary" aria-labelledby="latency-heading">
        <div class="primary-head">
          <h2 id="latency-heading">レイテンシ推移</h2>
          <p class="view-meta" id="viewMeta"></p>
          <div class="latency-legend" id="latencyLegend" hidden aria-hidden="true"></div>
        </div>

        <div
          class="plot chart-container chart-container--latency"
          id="latencyChartContainer"
        >
          <div class="plot-body chart-plot-frame">
            <canvas
              id="latencyChart"
              role="img"
              aria-label="DNS レイテンシ推移グラフ"
            ></canvas>
          </div>
          <!-- History pan: shown only when full history exceeds the selected range -->
          <div
            class="pan chart-hscroll"
            id="latencyChartScroll"
            hidden
            role="scrollbar"
            aria-controls="latencyChart"
            aria-orientation="horizontal"
            aria-label="履歴のスクロール"
          >
            <div class="pan-spacer chart-hscroll-inner" id="latencyChartInner"></div>
          </div>
        </div>

        <div class="metrics" id="statsGrid" aria-label="レイテンシ統計"></div>
      </section>

      <!-- Secondary: failures -->
      <section class="secondary" aria-labelledby="error-heading">
        <div class="secondary-head">
          <h2 id="error-heading">エラー種別内訳</h2>
          <p class="uptime" id="uptimeBadge" aria-label="Uptime"></p>
        </div>
        <div class="band chart-container chart-container--short">
          <canvas id="errorChart" role="img" aria-label="エラー種別の内訳"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RMH8Q8RB96"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-RMH8Q8RB96');
</script>
</body>
</html>
