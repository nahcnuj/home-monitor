<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="自宅回線の DNS 応答レイテンシをサーバー別に可視化するモニター">
  <title>DNS Latency Monitor</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1645913691678081" crossorigin="anonymous"></script>
</head>
<body>
  <a class="skip-link" href="#main">メインコンテンツへ</a>

  <header class="site-header">
    <div class="site-header__row">
      <div class="site-header__brand">
        <h1>DNS Latency Monitor</h1>
        <p class="site-header__sub" id="subtitle">自宅回線の DNS 応答レイテンシ — DNS サーバー別</p>
      </div>
      <div
        class="range-selector"
        id="rangeSelector"
        role="group"
        aria-label="表示範囲"
      ></div>
    </div>
  </header>

  <main class="site-main" id="main">
    <p class="status-line" id="lastUpdated" role="status" aria-live="polite">読み込み中...</p>

    <section class="panel panel--latency" aria-labelledby="latency-heading">
      <div class="panel__head">
        <div class="panel__titles">
          <h2 id="latency-heading">レイテンシ推移</h2>
          <p class="panel__meta" id="viewMeta"></p>
        </div>
        <div class="latency-legend" id="latencyLegend" hidden aria-hidden="true"></div>
      </div>

      <div
        class="chart-box chart-container chart-container--latency"
        id="latencyChartContainer"
      >
        <div class="chart-box__plot chart-plot-frame">
          <canvas
            id="latencyChart"
            role="img"
            aria-label="DNS レイテンシ推移グラフ"
          ></canvas>
        </div>
        <div
          class="chart-box__pan chart-hscroll"
          id="latencyChartScroll"
          hidden
          role="scrollbar"
          aria-controls="latencyChart"
          aria-orientation="horizontal"
          aria-label="履歴のスクロール"
        >
          <div class="chart-box__pan-inner chart-hscroll-inner" id="latencyChartInner"></div>
        </div>
      </div>

      <div class="stats" id="statsGrid" aria-label="レイテンシ統計"></div>
    </section>

    <section class="panel panel--errors" aria-labelledby="error-heading">
      <div class="panel__head">
        <h2 id="error-heading">エラー種別内訳</h2>
        <p class="uptime" id="uptimeBadge" aria-label="Uptime"></p>
      </div>
      <div class="chart-box chart-box--band chart-container chart-container--short">
        <canvas id="errorChart" role="img" aria-label="エラー種別の内訳"></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>

<!-- Google tag (gtag.js) -->

  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-RMH8Q8RB96');
</script>
</body>
</html>
