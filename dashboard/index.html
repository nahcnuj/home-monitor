<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNS Latency Monitor</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1645913691678081" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="header-title">
          <h1>DNS Latency Monitor</h1>
          <p class="subtitle" id="subtitle">自宅回線 · DNS サーバー別レイテンシ</p>
        </div>
      </div>
      <div class="top-bar-meta">
        <p class="last-updated" id="lastUpdated">読み込み中...</p>
        <div class="range-selector" id="rangeSelector" role="group" aria-label="表示範囲"></div>
      </div>
    </header>

    <main class="deck">
      <section class="panel panel--latency chart-section chart-section--latency">
        <div class="panel-chrome">
          <div class="section-heading section-heading--latency">
            <div class="panel-title-row">
              <span class="panel-tag">SCOPE</span>
              <h2>レイテンシ推移</h2>
            </div>
            <div class="latency-legend" id="latencyLegend" hidden></div>
          </div>
        </div>
        <div class="chart-container chart-container--latency" id="latencyChartContainer">
          <div class="chart-plot-frame">
            <canvas id="latencyChart"></canvas>
          </div>
          <!-- Wide spacer drives native scrollbar; chart X domain pans with scroll (no huge canvas). -->
          <div class="chart-hscroll" id="latencyChartScroll" hidden>
            <div class="chart-hscroll-inner" id="latencyChartInner"></div>
          </div>
        </div>
        <div class="instrument-rail">
          <div class="stats-bar" id="statsGrid" aria-label="レイテンシ統計"></div>
          <p class="uptime-badge" id="uptimeBadge" aria-label="Uptime"></p>
        </div>
      </section>

      <section class="panel panel--error chart-section chart-section--error">
        <div class="panel-chrome">
          <div class="section-heading">
            <div class="panel-title-row">
              <span class="panel-tag">ERRORS</span>
              <h2>エラー種別内訳</h2>
            </div>
          </div>
        </div>
        <div class="chart-container chart-container--short">
          <canvas id="errorChart"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>

<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RMH8Q8RB96');
</script>
</body>
</html>
