<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="自宅回線の DNS 応答レイテンシをサーバー別に可視化するモニター">
  <title>DNS Latency Monitor</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1645913691678081" crossorigin="anonymous"></script>
</head>
<body>
  <a class="skip-link" href="#main">メインコンテンツへ</a>

  <div class="app">
    <header class="top">
      <div class="top-brand">
        <h1>DNS Latency Monitor</h1>
        <p class="top-sub" id="subtitle">自宅回線の DNS 応答レイテンシ — DNS サーバー別</p>
      </div>
      <div class="range" id="rangeSelector" role="group" aria-label="表示範囲"></div>
    </header>

    <main class="main" id="main">
      <p class="status is-loading" id="lastUpdated" role="status" aria-live="polite">読み込み中...</p>

      <!-- Hero: the chart. Everything else is supporting chrome. -->
      <section class="hero" aria-labelledby="latency-heading">
        <div class="hero-head">
          <h2 id="latency-heading">レイテンシ推移</h2>
          <p class="view-meta" id="viewMeta" aria-live="polite"></p>
          <div class="latency-legend" id="latencyLegend" hidden aria-hidden="true"></div>
        </div>

        <div class="plot chart-container chart-container--latency" id="latencyChartContainer">
          <div class="plot-canvas chart-plot-frame">
            <canvas id="latencyChart" role="img" aria-label="DNS レイテンシ推移グラフ"></canvas>
          </div>

          <!-- Quiet history pan: only meaningful when history > selected range -->
          <div class="pan" id="historyNav" data-active="false" hidden>
            <div class="pan-track-wrap">
              <div class="pan-window" id="historyWindow" aria-hidden="true"></div>
              <div
                class="pan-track chart-hscroll"
                id="latencyChartScroll"
                hidden
                role="scrollbar"
                aria-controls="latencyChart"
                aria-orientation="horizontal"
                aria-label="履歴のスクロール"
                tabindex="0"
              >
                <div class="pan-spacer chart-hscroll-inner" id="latencyChartInner"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="stats" id="statsGrid" aria-label="レイテンシ統計"></div>
      </section>

      <section class="errors" aria-labelledby="error-heading">
        <div class="errors-head">
          <h2 id="error-heading">エラー種別内訳</h2>
          <p class="uptime" id="uptimeBadge" aria-label="Uptime"></p>
        </div>
        <div class="errors-plot chart-container chart-container--short">
          <canvas id="errorChart" role="img" aria-label="エラー種別の内訳"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RMH8Q8RB96"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-RMH8Q8RB96');
</script>
</body>
</html>
