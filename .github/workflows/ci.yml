name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: PowerShell script tests
        shell: pwsh
        run: ./scripts/tests/Invoke-AllTests.ps1

  windows-collect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: PowerShell script tests (including real nslookup)
        shell: pwsh
        run: ./scripts/tests/Invoke-AllTests.ps1
