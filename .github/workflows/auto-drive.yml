name: Auto-drive

on:
  issues:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to drive
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  auto-drive:
    name: Auto-drive issue
    uses: conahcnuj/conahcnuj/.github/workflows/issue-driver.yml@3158e4fe73dd8dfd60ee217cee2ac321f2aac4b0
    with:
      number: ${{ github.event.pull_request.number || github.event.issue.number || (github.event.inputs.number && fromJSON(github.event.inputs.number)) }}
      repository: ${{ github.repository }}
      environment: conahcnuj
    secrets:
      APP_ID: ${{ secrets.CONAHCNUJ_APP_ID }}
      INSTALLATION_ID: ${{ secrets.CONAHCNUJ_INSTALLATION_ID }}
      PRIVATE_KEY: ${{ secrets.CONAHCNUJ_PRIVATE_KEY }}
