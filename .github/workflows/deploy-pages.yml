name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Restore published data
        uses: actions/cache/restore@v4
        with:
          path: data-store
          key: data-store-restore-${{ github.run_id }}
          restore-keys: |
            dns-data-

      - name: Prepare data store
        run: mkdir -p data-store/data

      - name: Check published data
        id: check_data
        run: |
          if [[ -f data-store/data/dns-latency.tsv ]]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            echo "No published data in the cache yet; this run will not overwrite the live Pages deployment."
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Pages artifact
        if: steps.check_data.outputs.has_data == 'true'
        env:
          PAGES_DATA_DIR: ${{ github.workspace }}/data-store
        run: bash scripts/prepare-pages.sh

      - uses: actions/configure-pages@v6
        if: steps.check_data.outputs.has_data == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.check_data.outputs.has_data == 'true'
        with:
          path: dashboard/dist

      - id: deployment
        if: steps.check_data.outputs.has_data == 'true'
        uses: actions/deploy-pages@v5