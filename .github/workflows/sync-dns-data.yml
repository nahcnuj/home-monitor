name: Sync DNS Data

on:
  workflow_dispatch:
    inputs:
      data_b64:
        description: Gzip+base64 encoded TSV delta
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          path: source

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Merge incoming TSV data
        id: merge
        env:
          DATA_B64: ${{ github.event.inputs.data_b64 }}
        run: |
          CONFIG_JSON=$(cd source && npm ci --silent && npx tsx scripts/read-config.ts)
          export CONFIG_JSON

          data_b64="${DATA_B64:-}"
          if [ -z "$data_b64" ]; then
            echo "data_updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "data_updated=true" >> $GITHUB_OUTPUT

          python3 << 'PYEOF'
          import os, base64, gzip, re, json, time

          IPV4 = re.compile(r"^(?:\d{1,3}\.){3}\d{1,3}$")
          IPV6 = re.compile(r"^[0-9a-fA-F:]+$")

          def is_dns_server_key(key: str) -> bool:
              if key == "unknown":
                  return True
              return bool(IPV4.match(key) or IPV6.match(key))

          def row_key(cols: list[str]) -> tuple[str, str, str]:
              domain = ""
              if len(cols) >= 4 and cols[2] and not cols[2].isdigit():
                  domain = cols[2]
              return (cols[0], cols[1], domain)

          master_cfg = json.loads(os.environ["CONFIG_JSON"])
          data_cutoff = int(master_cfg.get("data_cutoff_ts", 0))
          rolling_cutoff = int(time.time()) - 7 * 86400
          cutoff = max(rolling_cutoff, data_cutoff)

          data_b64 = os.environ.get("DATA_B64", "")
          if not data_b64:
              exit(0)

          incoming = gzip.decompress(base64.b64decode(data_b64)).decode("utf-8")
          incoming_lines = [l for l in incoming.strip().split("\n") if l.strip()]

          path = "pages/docs/data/dns-latency.tsv"
          existing_lines = []
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  existing_lines = [l for l in f.read().strip().split("\n") if l.strip()]

          # Records already in the store are not "newly inserted". Downdetector
          # reporting (issue #30) only considers new records from the last hour.
          existing_keys = set()
          for line in existing_lines:
              cols = line.split("\t")
              if len(cols) >= 2 and is_dns_server_key(cols[1]):
                  existing_keys.add(row_key(cols))

          seen = set()
          merged = []
          new_lines = []
          for line in existing_lines + incoming_lines:
              cols = line.split("\t")
              if len(cols) < 2:
                  continue
              if not is_dns_server_key(cols[1]):
                  continue
              key = row_key(cols)
              if key in seen:
                  continue
              seen.add(key)
              merged.append(line)
              if key not in existing_keys:
                  new_lines.append(line)

          merged = sorted(
              [l for l in merged if int(l.split("\t")[0]) >= cutoff],
              key=lambda l: int(l.split("\t")[0]),
          )

          # Downdetector detection (#30): among newly inserted records from the
          # last hour, report a service when any record has latency >= threshold
          # or is a timeout (dns_timeout / job_timeout). Only resolvers mapped
          # in downdetector.service_by_resolver are reportable.
          dd = master_cfg.get("downdetector", {}) or {}
          service_by_resolver = dd.get("service_by_resolver", {}) or {}
          services_cfg = dd.get("services", {}) or {}
          threshold = int(dd.get("latency_threshold_ms", 1000) or 1000)
          now = int(time.time())
          one_hour_ago = now - 3600

          def is_timeout(cols: list[str]) -> bool:
              if len(cols) < 5:
                  return False
              return cols[4] in ("dns_timeout", "job_timeout")

          def is_bad(cols: list[str]) -> bool:
              if is_timeout(cols):
                  return True
              if len(cols) >= 4:
                  try:
                      latency = int(cols[3])
                  except ValueError:
                      latency = 0
                  return latency >= threshold
              return False

          bad_by_service = {}
          for line in new_lines:
              cols = line.split("\t")
              if len(cols) < 2:
                  continue
              resolver = cols[1]
              service = service_by_resolver.get(resolver)
              if not service:
                  continue
              try:
                  ts = int(cols[0])
              except ValueError:
                  continue
              if ts < one_hour_ago:
                  continue
              if not is_bad(cols):
                  continue
              bad_by_service.setdefault(service, []).append(line)

          if bad_by_service:
              targets = []
              for service, lines in bad_by_service.items():
                  svc = services_cfg.get(service, {}) or {}
                  page_url = svc.get("page_url", "")
                  if not page_url:
                      continue
                  has_timeout = any(is_timeout(l.split("\t")) for l in lines)
                  targets.append({
                      "service": service,
                      "page_url": page_url,
                      "indicator_label": svc.get("indicator_label", "Broadband Internet"),
                      "problem_type": "timeout" if has_timeout else "high_latency",
                      "count": len(lines),
                  })
              if targets:
                  with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                      out.write("downdetector_targets=" + json.dumps(targets) + "\n")
                  print("downdetector targets:", json.dumps(targets))

          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w", encoding="utf-8") as f:
              if merged:
                  f.write("\n".join(merged) + "\n")
          PYEOF

      - name: Build dns-latency.json for the dashboard
        run: |
          TSV=pages/docs/data/dns-latency.tsv
          JSON=pages/docs/data/dns-latency.json
          if [[ -f "$TSV" ]]; then
            (cd source && npx tsx scripts/tsv-to-json.ts "../$TSV" "../$JSON")
          else
            mkdir -p pages/docs/data
            echo '[]' > "$JSON"
          fi

      - name: Commit and push gh-pages
        working-directory: pages
        id: commit-push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git merge origin/master --no-edit -m "merge master into gh-pages"

          if [[ -d docs/config ]]; then
            git rm -rf docs/config
          fi

          git add -f docs/data/dns-latency.tsv docs/data/dns-latency.json
          if git diff --cached --quiet && git diff --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update dns latency data"
          fi
          git push -f origin gh-pages

          echo "pushed=true" >> $GITHUB_OUTPUT

      - name: Trigger Pages deployment
        # GITHUB_TOKEN pushes do not fire `push` events. Dispatch once when we
        # actually pushed (Deploy Pages no longer listens to this workflow via
        # workflow_run, so this is the sole deploy path for Sync).
        if: steps.commit-push.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'gh-pages'
            });

      - name: Install Playwright browsers (Downdetector RPA)
        if: steps.merge.outputs.downdetector_targets != ''
        working-directory: source
        run: npx playwright install chromium --with-deps

       - name: Report to Downdetector
         # Runs in GitHub Actions (not on the home PC): when the home DNS is
         # broken the PC often cannot reach Downdetector, so the report must be
         # submitted from the cloud. The data push and Pages deployment already
         # completed above; a reporting failure therefore marks the run as
         # failed for visibility without undoing the published data.
         if: steps.merge.outputs.downdetector_targets != ''
        working-directory: source
        env:
          DD_TARGETS: ${{ steps.merge.outputs.downdetector_targets }}
        run: node scripts/report-downdetector-targets.mjs
