name: Sync DNS Data

on:
  workflow_dispatch:
    inputs:
      data_b64:
        description: Gzip+base64 encoded TSV delta
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    name: Sync DNS data
    runs-on: ubuntu-26.04
    outputs:
      downdetector_targets: ${{ steps.merge.outputs.downdetector_targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          path: source

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Restore published data
        uses: actions/cache/restore@v5
        with:
          path: data-store
          key: data-store-restore-${{ github.run_id }}
          restore-keys: |
            dns-data-

      - name: Prepare data store
        run: mkdir -p data-store/data

      - name: Migrate legacy published data
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash source/scripts/migrate-legacy-published-data.sh

      - name: Merge incoming TSV data
        id: merge
        env:
          DATA_B64: ${{ github.event.inputs.data_b64 }}
        run: |
          cd source
          CONFIG_JSON=$(npm ci --silent && npx tsx scripts/read-config.ts)
          export CONFIG_JSON
          cd ..

          data_b64="${DATA_B64:-}"
          if [ -z "$data_b64" ]; then
            echo "data_updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "data_updated=true" >> $GITHUB_OUTPUT

          python3 << 'PYEOF'
          import os, base64, gzip, re, json, time

          IPV4 = re.compile(r"^(?:\d{1,3}\.){3}\d{1,3}$")
          IPV6 = re.compile(r"^[0-9a-fA-F:]+$")

          def is_dns_server_key(key: str) -> bool:
              if key == "unknown":
                  return True
              return bool(IPV4.match(key) or IPV6.match(key))

          def row_key(cols: list[str]) -> tuple[str, str, str]:
              domain = ""
              if len(cols) >= 4 and cols[2] and not cols[2].isdigit():
                  domain = cols[2]
              return (cols[0], cols[1], domain)

          master_cfg = json.loads(os.environ["CONFIG_JSON"])
          data_cutoff = int(master_cfg.get("data_cutoff_ts", 0))
          rolling_cutoff = int(time.time()) - 7 * 86400
          cutoff = max(rolling_cutoff, data_cutoff)

          data_b64 = os.environ.get("DATA_B64", "")
          if not data_b64:
              exit(0)

          incoming = gzip.decompress(base64.b64decode(data_b64)).decode("utf-8")
          incoming_lines = [l for l in incoming.strip().split("\n") if l.strip()]

          path = "data-store/data/dns-latency.tsv"
          existing_lines = []
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  existing_lines = [l for l in f.read().strip().split("\n") if l.strip()]

          existing_keys = set()
          for line in existing_lines:
              cols = line.split("\t")
              if len(cols) >= 2 and is_dns_server_key(cols[1]):
                  existing_keys.add(row_key(cols))

          seen = set()
          merged = []
          new_lines = []
          for line in existing_lines + incoming_lines:
              cols = line.split("\t")
              if len(cols) < 2:
                  continue
              if not is_dns_server_key(cols[1]):
                  continue
              key = row_key(cols)
              if key in seen:
                  continue
              seen.add(key)
              merged.append(line)
              if key not in existing_keys:
                  new_lines.append(line)

          merged = sorted(
              [l for l in merged if int(l.split("\t")[0]) >= cutoff],
              key=lambda l: int(l.split("\t")[0]),
          )

          dd = master_cfg.get("downdetector", {}) or {}
          service_by_resolver = dd.get("service_by_resolver", {}) or {}
          services_cfg = dd.get("services", {}) or {}
          threshold = int(dd.get("latency_threshold_ms", 1000) or 1000)
          now = int(time.time())
          one_hour_ago = now - 3600

          def is_timeout(cols: list[str]) -> bool:
              if len(cols) < 5:
                  return False
              return cols[4] in ("dns_timeout", "job_timeout")

          def is_bad(cols: list[str]) -> bool:
              if is_timeout(cols):
                  return True
              if len(cols) >= 4:
                  try:
                      latency = int(cols[3])
                  except ValueError:
                      latency = 0
                  return latency >= threshold
              return False

          bad_by_service = {}
          for line in new_lines:
              cols = line.split("\t")
              if len(cols) < 2:
                  continue
              resolver = cols[1]
              service = service_by_resolver.get(resolver)
              if not service:
                  continue
              try:
                  ts = int(cols[0])
              except ValueError:
                  continue
              if ts < one_hour_ago:
                  continue
              if not is_bad(cols):
                  continue
              bad_by_service.setdefault(service, []).append(line)

          if bad_by_service:
              targets = []
              for service, lines in bad_by_service.items():
                  svc = services_cfg.get(service, {}) or {}
                  page_url = svc.get("page_url", "")
                  if not page_url:
                      continue
                  has_timeout = any(is_timeout(l.split("\t")) for l in lines)
                  targets.append({
                      "service": service,
                      "page_url": page_url,
                      "indicator_label": svc.get("indicator_label", "Broadband Internet"),
                      "problem_type": "timeout" if has_timeout else "high_latency",
                      "count": len(lines),
                  })
              if targets:
                  with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                      out.write("downdetector_targets=" + json.dumps(targets) + "\n")
                  print("downdetector targets:", json.dumps(targets))
                  # `count` is the number of newly inserted bad DNS records for
                  # this service in the last hour (high latency or timeout). It
                  # is reported as metadata only: Downdetector gets ONE report
                  # per service, not `count` reports.
                  summary = ", ".join(
                      f"{t['service']} ({t['problem_type']})" for t in targets
                  )
                  print(f"::notice::Sync DNS data intends to report to Downdetector: {summary}")

          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w", encoding="utf-8") as f:
              if merged:
                  f.write("\n".join(merged) + "\n")
          PYEOF

      - name: Build dns-latency.json for the dashboard
        run: |
          TSV=data-store/data/dns-latency.tsv
          JSON=data-store/data/dns-latency.json
          if [[ -f "$TSV" ]]; then
            (cd source && npx tsx scripts/tsv-to-json.ts "../$TSV" "../$JSON")
          else
            mkdir -p data-store/data
            echo '[]' > "$JSON"
          fi

      - name: Save published data
        uses: actions/cache/save@v5
        with:
          path: data-store
          key: dns-data-${{ github.run_id }}

      - name: Build Pages artifact
        env:
          PAGES_DATA_DIR: ${{ github.workspace }}/data-store
        run: |
          cd source
          bash scripts/prepare-pages.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: source/dashboard/dist

      - id: deployment
        uses: actions/deploy-pages@v5

  report:
    name: Report to Downdetector
    needs: sync
    if: needs.sync.outputs.downdetector_targets != ''
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          path: source

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --silent

      - name: Install Playwright browsers (Downdetector RPA)
        working-directory: source
        run: |
          npx playwright install chromium --with-deps
          npx playwright install chrome

      - name: Install Xvfb (Downdetector RPA needs a headed browser to pass Cloudflare)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Report to Downdetector
        working-directory: source
        env:
          DD_TARGETS: ${{ needs.sync.outputs.downdetector_targets }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" node scripts/report-downdetector.mjs